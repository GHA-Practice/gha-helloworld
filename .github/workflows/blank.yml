
name: Artifact Upload Demo

on:
  workflow_dispatch:

jobs:
  job1:
  create_file:
    runs-on: ubuntu-latest

    steps:
      - name: Create a file
        run: echo "data-file" > data.txt

      - name: Upload file
        uses: actions/upload-artifact@v4
        with:
          name: datafile
          path: data.txt
jobs:
  runs-on: ubuntu-latest

  steps:
    - name: Download a file
      uses: actions/download-artifact@v4
      with:
        name: datafile

    - name: show file
      run: cat data.txt
