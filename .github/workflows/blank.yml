
name: Artifact Upload Demo

on:
  workflow_dispatch:

jobs:
  job1:
    runs-on: ubuntu-latest

    steps:
      - name: Create a file
        run: echo "data-file" > data.txt

      - name: Upload file
        uses: actions/upload-artifact@v4
        with:
          name: datafile
          path: data.txt

  job2:
    runs-on: ubuntu-latest
    needs: job1

    steps:
      - name: Download a file
        uses: actions/download-artifact@v4
        with:
          name: datafile

      - name: Show file
        run: cat data.txt
