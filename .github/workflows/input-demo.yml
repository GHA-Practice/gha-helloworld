name: Input Demo
on:
  workflow_dispatch:
    inputs:
      environment:
        description: " choos the environment to deploy"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - test
          - prod
      artifact_tag:
        description: choose the git tag to deploy
        required: true
jobs:
  Input-demo:
    runs-on: ubuntu-latest
    steps:
      - name: deploy application
        run: echo " Deploying ${{ inputs.artifact_tag}} the application ${{inputs.environment}}"
